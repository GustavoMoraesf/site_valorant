<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Valorant Universe</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="shortcut icon" href="../assets/icon/icon.png" type="image/x-icon">
</head>

<body>
    <div class="header">
        <div class="icon">
            <img src="../assets/icon/icon.png" alt="" />
        </div>
        <div class="login_user">
            <img src="../assets/imgs/fade_icon.webp" alt="" id="foto_user">
            <span id="nome_user">Usuario</span>
        </div>
        <div class="navbar">
            <ul class="links">
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="agentes.html">Agentes</a>
                </li>
                <li>
                    <a href="mapas.html">Mapas</a>
                </li>
                <li>
                    <a href="index.html#arsenal">Arsenal</a>
                </li>
                <li>
                    <a href="quiz.html">Quiz</a>
                </li>
                <li>
                    <a class="agora" href="dashboard.html">Dashboard</a>
                </li>
            </ul>
        </div>
    </div>
    <div class="dashboard">
        <div class="kpis">
            <div class="kpi1">
                <h1>Total de usuarios que fizeram o quiz</h1>
                <span id="total_user"></span>
            </div>
            <div class="kpi2">
                <h1>Função mais popular</h1>
                <span id="func_popular"></span>
            </div>
        </div>
        <div class="graficos">
            <div class="conteudo1">
                <div class="dunut">
                    <h1>Distribuição de Funções dos Usuários</h1>
                    <canvas id="donut"></canvas>
                </div>
                <div class="barras">
                    <h1>Comparação de Usuários por Função</h1>
                    <canvas id="barra"></canvas>
                </div>
            </div>
            <div class="conteudo2">
                <div class="linha">
                    <h1>Evolução de Participação no Quiz</h1>
                    <canvas id="linha"></canvas>
                </div>
                <div class="polarArea">
                    <h1>Seu Nível de Compatibilidade por Função (%)</h1>
                    <canvas id="polarArea"></canvas>
                </div>
            </div>
        </div>
    </div>

</body>

</html>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    window.onload = function () {
        kpiTotalUsuario();
        kpiFuncaoPopular();
        graficoDistribuicaoGeral();
        graficoUsuarioFuncao();
        graficoQuizDia();
        graficoCompatibilidadeUsuario();
    };

    nome_user.innerHTML = sessionStorage.NOME_USUARIO

    // Verificando se o usário ja tem foto salva, caso não tenha exibe a foto "Padrão"
    if (sessionStorage.FOTO_USUARIO == null || sessionStorage.FOTO_USUARIO == "null") {
        document.getElementById("foto_user").src = "../assets/imgs/icon_padrao.avif";
    } else {
        document.getElementById("foto_user").src = `../assets/imgs/${sessionStorage.FOTO_USUARIO}`;
    }

    function kpiTotalUsuario(){
        /*  KPI  */
        fetch("/dashboard/total-usuarios", {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        }).then(function(res){
            return res.json();

        }).then(function(dados) {
            total_user.innerHTML = dados[0].total_usuarios

        }).catch(function(erro) {
            console.log("Erro:", erro);

        });
    }


    function kpiFuncaoPopular(){
        fetch("/dashboard/mais-popular", {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        }).then(function(res){
            return res.json();

        }).then(function(dados) {
            func_popular.innerHTML = dados[0].funcao

        }).catch(function(erro) {
            console.log("Erro:", erro);
            
        });
    }


    function graficoDistribuicaoGeral(){
        /*  DONUT  */
        fetch("/dashboard/distribuicao-geral", {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        }).then(function(res){
            return res.json();

        }).then(function(dados) {
    
            let valores = dados[0]
    
            new Chart(document.getElementById('donut'), {
                type: 'doughnut',
                data: {
                    labels: ['Duelista', 'Controlador', 'Iniciador', 'Sentinela'],
                    datasets: [{
                        data: [
                            valores.duelista,
                            valores.controlador,
                            valores.iniciador,
                            valores.sentinela
                        ],
                        backgroundColor: [
                            '#ffc800',
                            '#4ea1ff',
                            '#050045',
                            '#ff0000'
                        ]
                    }]
                }
            })

        }).catch(function(erro) {
            console.log("Erro:", erro);
            
        });
    }

    function graficoUsuarioFuncao(){
        /*  BARRAS  */
        fetch("/dashboard/usuarios-funcao", {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        }).then(function(res){
            return res.json();

        }).then(function(dados) {
    
            let labels = [];
            let valores = [];
    
            for (let i = 0; i < dados.length; i++) {
                labels.push(dados[i].funcao);
                valores.push(dados[i].total);
            }
    
            new Chart(document.getElementById('barra'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Usuários',
                        data: valores,
                        backgroundColor: [
                            '#ffc800',
                            '#4ea1ff',
                            '#050045',
                            '#ff0000'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            })

        }).catch(function(erro) {
            console.log("Erro:", erro);
            
        });
    }


    function graficoQuizDia(){
        /*  LINHA  */
        fetch("/dashboard/quiz-dia", {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        }).then(function(res){
            return res.json();

        }).then(function(dados) {
    
            let labels = [];
            let valores = [];
    
            for (let i = dados.length -1; i >= 0; i--) {
                labels.push(dados[i].dia);
                valores.push(dados[i].total);
            }
    
            new Chart(document.getElementById('linha'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Quiz por dia',
                        data: valores,
                        borderColor: '#4ea1ff',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            })

        }).catch(function(erro) {
            console.log("Erro:", erro);
            
        });
    }


    function graficoCompatibilidadeUsuario(){
        /*  POLAR (USUÁRIO LOGADO)  */
        fetch(`/dashboard/compatibilidade/${sessionStorage.ID_USUARIO}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json'
            }
        }).then(function(res){
            return res.json();

        }).then(function(dados) {
    
            let valoresDuel = (dados[0].pontosDuelista / 10) * 100
            let valoresContro = (dados[0].pontosControlador / 10) * 100
            let valoresIni = (dados[0].pontosIniciador / 10) * 100
            let valoresSent = (dados[0].pontosSentinela / 10) * 100
    
            new Chart(document.getElementById('polarArea'), {
                type: 'polarArea',
                data: {
                    labels: ['Duelista', 'Controlador', 'Iniciador', 'Sentinela'],
                    datasets: [{
                        data: [
                            valoresDuel,
                            valoresContro,
                            valoresIni,
                            valoresSent
                        ],
                        backgroundColor: [
                            '#ffc800',
                            '#4ea1ff',
                            '#050045',
                            '#ff0000'
                        ]
                    }]
                }
            })

        }).catch(function(erro) {
            console.log("Erro:", erro);
            
        });
    }
</script>
